name: Build ShizuTv Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (leave 'auto' to use package.json version)"
        required: false
        default: "auto"
      prerelease:
        description: "Mark GitHub Release as pre-release?"
        type: boolean
        default: false
  push:
    tags:
      - "shizutv-v*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK (API 36)
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install web & Capacitor dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Build ShizuTv web bundle
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Resolve release tag & version
        id: meta
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          REQ_TAG="${{ github.event.inputs.release_tag }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -z "$REQ_TAG" ] || [ "$REQ_TAG" = "auto" ]; then
            TAG="shizutv-v${PKG_VER}"
          else
            TAG="$REQ_TAG"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${PKG_VER}" >> "$GITHUB_OUTPUT"

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd android-capacitor
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > shizutv-release.jks
            STORE_PASS="$ANDROID_STORE_PASSWORD"
            KEY_PASS="$ANDROID_KEY_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
          else
            STORE_PASS="shizutv123456"
            KEY_PASS="shizutv123456"
            KEY_ALIAS="shizutv"
            rm -f shizutv-release.jks
            keytool -genkeypair -v \
              -keystore shizutv-release.jks \
              -storetype PKCS12 \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=ShizuTv, OU=Mobile, O=ShizuTv, L=Internet, S=App, C=US"
          fi
          printf 'storeFile=shizutv-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > keystore.properties

      - name: Build Android Release APK
        run: |
          cd android-capacitor
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p release-apk
          APK_PATH=$(find android-capacitor/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found!" >&2
            exit 1
          fi
          cp "$APK_PATH" "release-apk/ShizuTv-${{ steps.meta.outputs.tag }}.apk"
          ls -lh release-apk/

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShizuTv-Android-APK
          path: release-apk/*.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "ShizuTv ${{ steps.meta.outputs.tag }}"
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          files: release-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
